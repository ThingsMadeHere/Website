server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API backend
    location /api/ {
        proxy_pass http://mchs-api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Matrix Client API - proxy to dendrite
    location /_matrix/ {
        proxy_pass http://mchs-dendrite:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_synapse/ {
        proxy_pass http://mchs-dendrite:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Well-known Matrix endpoints
    location /.well-known/matrix/server {
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.server": "matrix.mchsrobotics.dev:443"}';
    }

    location /.well-known/matrix/client {
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.homeserver": {"base_url": "https://matrix.mchsrobotics.dev"}}';
    }

    # React SPA - serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
