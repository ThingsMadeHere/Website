services:
  # One-shot service: builds the React frontend and writes output to ./dist
  # Run with: docker compose run --rm build-frontend
  build-frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./vite.config.js:/app/vite.config.js
      - ./postcss.config.js:/app/postcss.config.js
      - ./tailwind.config.js:/app/tailwind.config.js
      - ./dist:/app/dist
    command: sh -c "npm install && npm run build"

  dendrite:
    image: matrixdotorg/dendrite-monolith:latest
    container_name: mchs-dendrite
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8008:8008"   # Exposed for cloudflared tunnel
      - "8448:8448"   # Federation port — exposed directly
    volumes:
      - ./dendrite-config:/etc/dendrite
      - dendrite_data:/var/dendrite
    networks:
      - matrix
      - proxy

  postgres:
    image: postgres:15-alpine
    container_name: dendrite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dendrite
      POSTGRES_PASSWORD: mchs_robotics_secure_password
      POSTGRES_DB: dendrite
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dendrite"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - matrix

  # Backend API: user registration, login, verified status
  api:
    build: ./api
    container_name: mchs-api
    restart: unless-stopped
    ports:
      - "3001:3001"   # Exposed for cloudflared tunnel
    environment:
      DATABASE_URL: postgresql://dendrite:mchs_robotics_secure_password@postgres/dendrite
      DENDRITE_URL: http://mchs-dendrite:8008
      SHARED_SECRET: mchs_robotics_registration_secret
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
      dendrite:
        condition: service_started
    networks:
      - matrix
      - proxy

  # Serves the React frontend and proxies Matrix API calls to dendrite.
  # NPM (Nginx Proxy Manager) forwards mchsrobotics.dev → mchs-web:80
  # and matrix.mchsrobotics.dev → mchs-dendrite:8008
  web:
    image: nginx:alpine
    container_name: mchs-web
    restart: unless-stopped
    ports:
      - "8888:80"     # Exposed for cloudflared tunnel (bypasses NPM)
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - matrix
      - proxy

networks:
  matrix:
    driver: bridge
  # External network shared with Nginx Proxy Manager
  proxy:
    external: true
    name: docker_default

volumes:
  postgres_data:
  dendrite_data:
